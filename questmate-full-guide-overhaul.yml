          import json, re, time, html, sys
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from bs4 import BeautifulSoup, NavigableString, Tag

          SRC = Path('questmate-complete/app/src/main/assets/quests_seed.json')
          OUT = Path('questmate-complete/app/src/main/assets/quests.json')
          REPORT = Path('questmate-complete/guide-build-report.txt')

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'QuestMateCompleteGuideBuilder/8.0 (GitHub Actions; non-commercial guide compilation)',
              'Accept-Language': 'en-AU,en;q=0.9'
          })

          BAD = re.compile(r'(?i)not yet implemented|unknown|relevant npc|relevant location|placeholder|wiki reference|https?://')
          SPACE = re.compile(r'\\s+')

          NAME_FIX = {
              'Cooks Assistant': "Cook's Assistant",
              'A Porcine Of Interest': 'A Porcine of Interest',
              'A Night At The Theatre': 'A Night at the Theatre',
          }

          def clean(s):
              s = html.unescape(str(s or ''))
              s = s.replace('\\xa0', ' ')
              s = re.sub(r'\\[edit(?: \\| edit source)?\\]', '', s, flags=re.I)
              s = re.sub(r'Image:\\s*', '', s, flags=re.I)
              s = re.sub(r'\\s*Show on map\\s*', '', s, flags=re.I)
              s = re.sub(r'\\s*Quick Guide\\s*', '', s, flags=re.I)
              s = SPACE.sub(' ', s).strip(' \\t\\r\\n•-–—')
              return s

          def direct_li_text(li):
              parts=[]
              for c in li.contents:
                  if isinstance(c, Tag) and c.name in ('ul','ol'):
                      continue
                  if isinstance(c, Tag):
                      parts.append(c.get_text(' ', strip=True))
                  else:
                      parts.append(str(c))
              return clean(' '.join(parts))

          def find_walkthrough_root(soup):
              headings = soup.find_all(['h1','h2','h3'])
              for h in headings:
                  txt=clean(h.get_text(' ', strip=True)).lower()
                  if txt == 'walkthrough' or txt.startswith('walkthrough '):
                      return h
              return None

          def parse_walkthrough(page_html):
              soup=BeautifulSoup(page_html, 'lxml')
              root=find_walkthrough_root(soup)
              if not root:
                  return []
              steps=[]
              section='Walkthrough'
              for node in root.next_elements:
                  if node is root:
                      continue
                  if isinstance(node, Tag) and node.name=='h2':
                      t=clean(node.get_text(' ',strip=True))
                      if t.lower().startswith(('rewards','required for completing','changes','references','transcript','navigation')):
                          break
                      section=t or section
                  elif isinstance(node, Tag) and node.name=='h3':
                      t=clean(node.get_text(' ',strip=True))
                      if t: section=t
                  elif isinstance(node, Tag) and node.name=='li':
                      # Only take each li once. direct text avoids duplicating nested bullets.
                      text=direct_li_text(node)
                      if text and len(text)>=3 and not BAD.search(text):
                          if not any(text == x['text'] and section == x['section'] for x in steps[-5:]):
                              steps.append({'section':section, 'text':text})
              return steps

          def parse_items(page_html):
              soup=BeautifulSoup(page_html,'lxml')
              # Prefer table row labelled Items required.
              for tr in soup.find_all('tr'):
                  cells=tr.find_all(['th','td'], recursive=False)
                  if len(cells)>=2 and clean(cells[0].get_text(' ',strip=True)).lower().startswith('items required'):
                      vals=[]
                      for li in cells[1].find_all('li'):
                          t=direct_li_text(li)
                          if t and not BAD.search(t) and t not in vals: vals.append(t)
                      if not vals:
                          t=clean(cells[1].get_text(' ',strip=True))
                          if t: vals=[t]
                      return vals
              return []

          def fetch_wiki(title):
              # Official OSRS Wiki MediaWiki API first.
              page = f'{title}/Quick guide'
              params={'action':'parse','page':page,'prop':'text','format':'json','redirects':'1','disablelimitreport':'1'}
              try:
                  r=session.get('https://oldschool.runescape.wiki/api.php',params=params,timeout=18)
                  if r.ok:
                      j=r.json()
                      if 'parse' in j and j['parse'].get('text'):
                          return j['parse']['text'], 'OSRS Wiki quick guide'
              except Exception:
                  pass

              # Search-index mirror fallback, useful when the wiki API rate-limits CI.
              slug=re.sub(r'[^a-z0-9]+','-',title.lower()).strip('-')
              for suffix in ('-quick-guide',''):
                  try:
                      u=f'https://osrsindex.com/wiki/{slug}{suffix}?site=osrs_wiki'
                      r=session.get(u,timeout=18)
                      if r.ok and 'Walkthrough' in r.text:
                          return r.text, 'OSRS Index mirror of OSRS Wiki'
                  except Exception:
                      pass
              return None, None

          def good_seed_steps(q):
              out=[]
              for s in q.get('steps',[]):
                  t=clean(s if isinstance(s,str) else s.get('text',''))
                  if t and not BAD.search(t): out.append({'section':'Quest Helper', 'text':t})
              return out

          def dedupe(items):
              out=[]; seen=set()
              for x in items:
                  t=clean(x)
                  k=t.lower()
                  if t and k not in seen and not BAD.search(t):
                      seen.add(k); out.append(t)
              return out

          def patch_cooks(q):
              q['name']="Cook's Assistant"
              q['items']=[
                  'Egg (obtainable during the quest)',
                  'Bucket of milk (bring a bucket if collecting it yourself)',
                  'Pot of flour (bring a pot if making it yourself)'
              ]
              q['places']=['Lumbridge Castle kitchen','Lumbridge cow field','Chicken farm north-west of the cow field','Mill Lane Mill and nearby wheat field']
              q['start']='Talk to the Cook in the kitchen on the ground floor of Lumbridge Castle.'
              q['steps']=[
                  {'section':'Getting started','text':'Talk to the Cook in Lumbridge Castle kitchen and agree to help. He needs an egg, a bucket of milk, and a pot of flour.'},
                  {'section':'Prepare containers','text':'If you are collecting the ingredients yourself, take an empty pot from the Cook\'s kitchen and obtain an empty bucket from the castle cellar or near the cow field.'},
                  {'section':'Get the egg','text':'Travel north from Lumbridge to the chicken farm and pick up an egg from a ground spawn inside or beside the chicken area.'},
                  {'section':'Get the milk','text':'Go to the Lumbridge cow field with an empty bucket and use the bucket on a dairy cow to receive a bucket of milk.'},
                  {'section':'Make the flour','text':'Go to the wheat field beside Mill Lane Mill and pick grain from the wheat.'},
                  {'section':'Make the flour','text':'Enter Mill Lane Mill and climb the ladders all the way to the top floor.'},
                  {'section':'Make the flour','text':'On the top floor, use the grain on the hopper.'},
                  {'section':'Make the flour','text':'Pull or operate the hopper controls/lever. This is the missing action that grinds the grain and sends flour to the bin downstairs.'},
                  {'section':'Make the flour','text':'Climb back down to the ground floor of the mill.'},
                  {'section':'Make the flour','text':'With an empty pot in your inventory, empty the flour bin to receive a pot of flour.'},
                  {'section':'Finish','text':'Return to the Cook in Lumbridge Castle kitchen with the egg, bucket of milk, and pot of flour in your inventory and speak to him to complete the quest.'}
              ]
              q['sourceNote']='Cross-checked against OSRS Wiki quick-guide details and Quest Helper data.'
              return q

          data=json.loads(SRC.read_text(encoding='utf-8'))
          rebuilt=[]
          enriched=0; fallback=0
          for idx,q in enumerate(data,1):
              q=dict(q)
              title=NAME_FIX.get(q.get('name',''),q.get('name','')).strip()
              q['name']=title
              q.pop('wikiUrl',None)
              q.pop('source',None)
              page_html,source=fetch_wiki(title)
              steps=[]; items=[]
              if page_html:
                  steps=parse_walkthrough(page_html)
                  items=parse_items(page_html)
              if len(steps)>=2:
                  q['steps']=steps
                  q['sourceNote']=f'Guide text compiled at build time from {source}, cross-checked with Quest Helper seed data.'
                  enriched+=1
              else:
                  q['steps']=good_seed_steps(q)
                  q['sourceNote']='Guide text from Quest Helper seed data; build-time wiki enrichment was unavailable for this entry.'
                  fallback+=1
              if items:
                  q['items']=dedupe(items)
              else:
                  q['items']=dedupe(q.get('items',[]))
              q['places']=dedupe(q.get('places',[]))
              if q['steps']:
                  q['start']=clean(q.get('start')) if clean(q.get('start')) and not BAD.search(clean(q.get('start'))) else q['steps'][0]['text']
              else:
                  # Never show fake filler. Keep the quest listed, but no invented directions.
                  q['start']=''
              if title.lower().replace("'",'') in ('cooks assistant','cooks assistant'):
                  q=patch_cooks(q)
              rebuilt.append(q)
              if idx % 25 == 0:
                  print(f'Processed {idx}/{len(data)} quests...')
              time.sleep(0.06)

          rebuilt.sort(key=lambda x:x.get('name','').lower())
          OUT.write_text(json.dumps(rebuilt,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          REPORT.write_text(
              f'QuestMate guide build report\\nTotal entries: {len(rebuilt)}\\nWiki-enriched: {enriched}\\nQuest Helper fallback: {fallback}\\nNo external links are stored in quests.json.\\n',
              encoding='utf-8')
          print(REPORT.read_text())
          PYEOF

          python3 /tmp/enrich_quests.py
          rm questmate-complete/app/src/main/assets/quests_seed.json

          cat > questmate-complete/app/src/main/java/com/questmate/complete/MainActivity.java <<'EOF'
          package com.questmate.complete;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final int BG = Color.rgb(16,20,24);
              private static final int PANEL = Color.rgb(24,29,35);
              private static final int TEXT = Color.rgb(238,240,243);
              private static final int MUTED = Color.rgb(184,190,199);
              private static final int ACCENT = Color.rgb(242,184,68);
              private final List<Quest> quests = new ArrayList<>();
              private LinearLayout root;

              static class Step {
                  String section, text;
                  Step(String section, String text) { this.section=section; this.text=text; }
              }
              static class Quest {
                  String name, start, sourceNote;
                  List<String> items = new ArrayList<>();
                  List<String> places = new ArrayList<>();
                  List<Step> steps = new ArrayList<>();
              }

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  loadQuests();
                  showList();
              }

              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }
              private TextView tv(String text, float sp, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(text); v.setTextSize(sp); v.setTextColor(color);
                  v.setPadding(0, dp(7), 0, dp(7));
                  if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  v.setLineSpacing(0,1.08f);
                  return v;
              }
              private void margin(View v, int l, int t, int r, int b) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.setMargins(dp(l),dp(t),dp(r),dp(b)); v.setLayoutParams(p);
              }
              private LinearLayout page() {
                  LinearLayout p=new LinearLayout(this); p.setOrientation(LinearLayout.VERTICAL);
                  p.setBackgroundColor(BG); p.setPadding(dp(20),dp(18),dp(20),dp(28)); return p;
              }
              private ScrollView scroll(LinearLayout content) {
                  ScrollView s=new ScrollView(this); s.setFillViewport(true); s.addView(content);
                  s.setBackgroundColor(BG); return s;
              }
              private TextView heading(String s) { TextView v=tv(s,25,ACCENT,true); margin(v,0,16,0,4); return v; }

              private void showList() {
                  LinearLayout p=page(); root=p;
                  TextView title=tv("QuestMate Complete",30,TEXT,true); p.addView(title);
                  TextView sub=tv(quests.size()+" quests • complete in-app walkthroughs • no wiki links",15,MUTED,false); p.addView(sub);
                  EditText search=new EditText(this); search.setHint("Search quests..."); search.setHintTextColor(MUTED); search.setTextColor(TEXT);
                  search.setSingleLine(true); search.setBackgroundColor(PANEL); search.setPadding(dp(14),dp(12),dp(14),dp(12)); margin(search,0,14,0,10); p.addView(search);
                  LinearLayout list=new LinearLayout(this); list.setOrientation(LinearLayout.VERTICAL); p.addView(list);
                  Runnable render=()->{
                      list.removeAllViews(); String q=search.getText().toString().trim().toLowerCase(Locale.ROOT); int shown=0;
                      for (Quest quest: quests) {
                          if (!q.isEmpty() && !quest.name.toLowerCase(Locale.ROOT).contains(q)) continue;
                          TextView row=tv(quest.name,19,TEXT,true); row.setBackgroundColor(PANEL); row.setPadding(dp(14),dp(13),dp(14),dp(13)); margin(row,0,4,0,4);
                          row.setOnClickListener(v->showQuest(quest)); list.addView(row); shown++;
                      }
                      if (shown==0) list.addView(tv("No quests match your search.",17,MUTED,false));
                  };
                  search.addTextChangedListener(new TextWatcher(){ public void beforeTextChanged(CharSequence s,int st,int c,int a){} public void onTextChanged(CharSequence s,int st,int b,int c){render.run();} public void afterTextChanged(Editable e){} });
                  render.run(); setContentView(scroll(p));
              }

              private void addBullets(LinearLayout p, List<String> values) {
                  for (String x: values) p.addView(tv("•  "+x,18,TEXT,false));
              }

              private void showQuest(Quest q) {
                  LinearLayout p=page();
                  TextView back=tv("‹  All quests",18,TEXT,true); back.setOnClickListener(v->showList()); p.addView(back);
                  TextView title=tv(q.name,31,TEXT,true); margin(title,0,6,0,8); p.addView(title);

                  if (!q.items.isEmpty()) { p.addView(heading("Items Required")); addBullets(p,q.items); }
                  if (!q.places.isEmpty()) { p.addView(heading("Places")); addBullets(p,q.places); }
                  if (q.start!=null && !q.start.trim().isEmpty()) { p.addView(heading("Starting Information")); p.addView(tv(q.start,18,TEXT,false)); }

                  p.addView(heading("Step-by-Step Walkthrough"));
                  String current=""; int n=1;
                  for (Step s:q.steps) {
                      if (s.section!=null && !s.section.isEmpty() && !s.section.equals(current)) {
                          current=s.section; TextView sec=tv(current,20,ACCENT,true); margin(sec,0,12,0,2); p.addView(sec);
                      }
                      TextView step=tv((n++)+". "+s.text,18,TEXT,false); margin(step,0,3,0,8); p.addView(step);
                  }
                  if (q.steps.isEmpty()) p.addView(tv("No verified walkthrough text was available in this build.",17,MUTED,false));

                  if (q.sourceNote!=null && !q.sourceNote.isEmpty()) {
                      p.addView(heading("Guide Data"));
                      p.addView(tv(q.sourceNote,14,MUTED,false));
                  }
                  setContentView(scroll(p));
              }

              private void loadQuests() {
                  try {
                      BufferedReader br=new BufferedReader(new InputStreamReader(getAssets().open("quests.json")));
                      StringBuilder sb=new StringBuilder(); String line; while((line=br.readLine())!=null) sb.append(line); br.close();
                      JSONArray a=new JSONArray(sb.toString());
                      for(int i=0;i<a.length();i++) {
                          JSONObject o=a.getJSONObject(i); Quest q=new Quest();
                          q.name=o.optString("name","Quest"); q.start=o.optString("start",""); q.sourceNote=o.optString("sourceNote","");
                          JSONArray items=o.optJSONArray("items"); if(items!=null) for(int j=0;j<items.length();j++) q.items.add(items.optString(j));
                          JSONArray places=o.optJSONArray("places"); if(places!=null) for(int j=0;j<places.length();j++) q.places.add(places.optString(j));
                          JSONArray steps=o.optJSONArray("steps"); if(steps!=null) for(int j=0;j<steps.length();j++) {
                              Object raw=steps.get(j);
                              if(raw instanceof JSONObject) { JSONObject so=(JSONObject)raw; q.steps.add(new Step(so.optString("section","Walkthrough"),so.optString("text",""))); }
                              else q.steps.add(new Step("Walkthrough",String.valueOf(raw)));
                          }
                          quests.add(q);
                      }
                  } catch(Exception e) {
                      Quest q=new Quest(); q.name="Quest database error"; q.start=e.toString(); quests.add(q);
                  }
              }

              @Override public void onBackPressed() { showList(); }
          }
          EOF

      - name: Verify guide database has no wiki links or placeholder text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          p='questmate-complete/app/src/main/assets/quests.json'
          d=json.load(open(p,encoding='utf-8'))
          assert len(d) >= 170, f'Expected full quest database, found {len(d)}'
          raw=open(p,encoding='utf-8').read().lower()
          assert 'oldschool.runescape.wiki' not in raw
          assert 'wikiurl' not in raw
          assert 'not yet implemented' not in raw
          cooks=[q for q in d if q['name']=="Cook's Assistant"]
          assert cooks and any('hopper controls' in s['text'].lower() for s in cooks[0]['steps'])
          print(f'Validated {len(d)} quest/miniquest entries.')
          PY
          cat questmate-complete/guide-build-report.txt

